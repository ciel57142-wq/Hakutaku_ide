<!DOCTYPE html>
<html lang="en" data-ide-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Juniper IDE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>/*__MONACO_CSS__*/</style>
<style>/*__XTERM_CSS__*/</style>
<style>/*__APP_CSS__*/</style>
</head>
<body>
<div id="app">
  <header id="titlebar">
    <div class="tb-left">
      <span id="logo" aria-hidden="true"></span>
      <nav id="menubar" aria-label="Menu"></nav>
    </div>
    <button id="cmd-center" type="button" title="Go to File (Ctrl+P)"></button>
    <div class="tb-right" id="layout-btns"></div>
  </header>
  <div id="main">
    <nav id="activity" aria-label="Views"></nav>
    <aside id="sidebar" aria-label="Side bar"></aside>
    <div class="sash sash-v" id="sash-side"></div>
    <section id="center">
      <div id="editor-area">
        <div id="tabbar"><div id="tabs" role="tablist"></div><div id="tab-actions"></div></div>
        <div id="crumbs"></div>
        <div id="editor-stack">
          <div id="monaco-host"></div>
          <div id="diff-host" hidden></div>
          <div id="page-host" hidden></div>
          <div id="empty-host" hidden></div>
          <div id="load-host"><span class="spinner"></span><span id="load-msg">Loading editor…</span></div>
        </div>
      </div>
      <div class="sash sash-h" id="sash-panel"></div>
      <section id="panel" aria-label="Panel">
        <div id="panel-head"><div id="panel-tabs" role="tablist"></div><div id="panel-actions"></div></div>
        <div id="panel-body">
          <div id="pane-problems" class="pane" hidden></div>
          <div id="pane-output" class="pane" hidden></div>
          <div id="pane-terminal" class="pane"><div id="term-stack"></div><div id="term-list" hidden></div></div>
        </div>
      </section>
    </section>
  </div>
  <footer id="statusbar"><div id="status-left"></div><div id="status-right"></div></footer>
</div>
<div id="overlays"></div>
<div id="toasts" aria-live="polite"></div>
<input type="file" id="file-input" multiple hidden>
<input type="file" id="folder-input" webkitdirectory hidden>
<script>/*__APP_JS__*/</script>
</body>
</html>
